<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f1319">
<title>Stackview · AnantSAT-II</title>
<link rel="preload" href="homepage/instrument-serif.woff2" as="font" type="font/woff2" crossorigin>
<style>
  @font-face {
    font-family: "Instrument Serif";
    src: url("homepage/instrument-serif.woff2") format("woff2");
    font-style: normal;
    font-weight: 400;
    font-display: swap;
  }
  @font-face {
    font-family: "Barlow Semi Condensed";
    src: url("homepage/barlow-regular.woff2") format("woff2");
    font-style: normal;
    font-weight: 400;
    font-display: swap;
  }
  :root {
    color-scheme: dark;
    --background: #110c11;
    --ink: #f7f0e8;
    --muted: #c5b9b5;
    --accent: #e5c6a5;
    --line: #eee1d442;
    --viewer-accent: #9dbdff;
    --control-bg: #171c248c;
    --control-line: #98a2b359;
    --control-radius: 8px;
    --display: "Instrument Serif", Georgia, serif;
    --body: "Barlow Semi Condensed", "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100svh;
    display: grid;
    grid-template-rows: auto 1fr auto;
    isolation: isolate;
    background: var(--background);
    color: var(--ink);
    font: 400 17px/1.45 var(--body);
  }
  .sky {
    position: fixed;
    inset: 0;
    z-index: -1;
    overflow: hidden;
    pointer-events: none;
  }
  .sky img {
    --horizon-x: 0px;
    --horizon-y: 0px;
    --horizon-light: 1;
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: 72% 66%;
    transform-origin: 74% 68%;
    animation: horizon-drift 65s ease-in-out infinite alternate;
  }
  body[data-motion="playing"] .sky img {
    translate: var(--horizon-x) var(--horizon-y);
    filter: brightness(var(--horizon-light));
    transition: translate 650ms ease-out, filter 850ms ease-out;
  }
  .sky::after {
    content: "";
    position: absolute;
    inset: 0;
    background:
      linear-gradient(90deg, #110c11a6, #110c1147 53%, transparent 83%),
      linear-gradient(0deg, #110c119e, transparent 36%);
  }
  @keyframes horizon-drift {
    from { transform: scale(1.055); }
    to { transform: scale(1.08) translate(-1.3%, 1.1%); }
  }
  body[data-motion="paused"] .sky img { animation-play-state: paused; }
  .bar, main, footer {
    width: min(1440px, 100% - 2 * clamp(24px, 6vw, 104px));
    margin-inline: auto;
  }
  .bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    min-height: 84px;
    border-bottom: 1px solid var(--line);
  }
  .brand { font-size: 20px; letter-spacing: .12em; text-transform: uppercase; }
  .guide, .motion {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 12px;
    border: 1px solid var(--control-line);
    border-radius: var(--control-radius);
    background: var(--control-bg);
    color: var(--ink);
    font: inherit;
    font-size: 15px;
    text-decoration: none;
  }
  .motion[hidden] { display: none; }
  .guide:hover, .motion:hover { border-color: var(--viewer-accent); }
  main {
    align-self: center;
    padding-block: clamp(38px, 8vh, 106px);
  }
  .mission {
    margin: 0 0 9px;
    color: var(--accent);
    font-size: 15px;
    letter-spacing: .19em;
    text-transform: uppercase;
  }
  h1 {
    margin: 0 0 clamp(26px, 5.2vh, 60px);
    font: 400 clamp(64px, 11vw, 166px)/.86 var(--display);
    letter-spacing: -.045em;
  }
  .choices {
    display: grid;
    width: min(100%, 530px);
    border-top: 1px solid var(--line);
  }
  .choice {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 40px;
    align-items: center;
    gap: 14px;
    min-height: 88px;
    padding: 11px 4px 13px 0;
    border-bottom: 1px solid var(--line);
    color: inherit;
    text-decoration: none;
  }
  .choice h2 {
    margin: 0;
    font: 400 35px/1.04 var(--display);
    letter-spacing: -.012em;
    transition: color .25s ease;
  }
  .choice p { margin: 5px 0 0; color: var(--muted); }
  .arrow {
    width: 38px;
    height: 38px;
    display: grid;
    place-items: center;
    border: 1px solid var(--control-line);
    border-radius: var(--control-radius);
    background: var(--control-bg);
    color: var(--viewer-accent);
    font-size: 19px;
    transition: transform .25s ease, color .25s ease, background .25s ease;
  }
  .choice:is(:hover, :focus-visible) h2 { color: var(--viewer-accent); }
  .choice:is(:hover, :focus-visible) .arrow {
    transform: translateX(3px);
    color: var(--background);
    background: var(--viewer-accent);
  }
  :is(a, button):focus-visible { outline: 2px solid var(--viewer-accent); outline-offset: 4px; }
  footer {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    min-height: 68px;
  }
  .motion { cursor: pointer; }
  @media (max-width: 640px) {
    .bar { min-height: 65px; }
    .brand { font-size: 17px; }
    .sky img {
      position: absolute;
      bottom: 0;
      height: 86%;
      object-position: 59% 64%;
      mask-image: linear-gradient(transparent, #000 18%);
    }
    .sky::after { background: linear-gradient(90deg, #110c11d1, #110c1180 68%, #110c1140); }
    h1 { font-size: clamp(60px, 14.5vw, 94px); }
    .choice h2 { font-size: 31px; }
    .choice { min-height: 81px; }
    footer { min-height: 54px; }
  }
  @media (prefers-reduced-motion: reduce) {
    body:not([data-motion="playing"]) .sky img { animation-play-state: paused; }
    .choice h2, .arrow { transition: none; }
    .choice:is(:hover, :focus-visible) .arrow { transform: none; }
  }
</style>
</head>
<body>
<div class="sky" aria-hidden="true"><img src="homepage/earth-limb.webp" alt="" fetchpriority="high"></div>
<header class="bar">
  <span class="brand">Stackview</span>
  <a class="guide" href="main/help.html">Viewer guide <span aria-hidden="true">↗</span></a>
</header>
<main>
  <p class="mission">3U CubeSat</p>
  <h1>AnantSAT-II</h1>
  <nav class="choices" aria-label="Choose a viewer">
    <a class="choice" href="system-stack/">
      <div>
        <h2>System Stack</h2>
        <p>Full spacecraft assembly · Case 1 and Case 2</p>
      </div>
      <span class="arrow" aria-hidden="true">→</span>
    </a>
    <a class="choice" href="main/">
      <div>
        <h2>Board Viewer</h2>
        <p>Individual PCBs, schematics, 3D models and BOMs</p>
      </div>
      <span class="arrow" aria-hidden="true">→</span>
    </a>
  </nav>
</main>
<footer><button class="motion" type="button" hidden>Pause motion</button></footer>
<script>
  const motionButton = document.querySelector('.motion');
  const horizon = document.querySelector('.sky img');
  const motionPreference = matchMedia('(prefers-reduced-motion: reduce)');
  let pointerFrame = 0;
  let pointerX = 0;
  let pointerY = 0;

  function resetHorizon() {
    cancelAnimationFrame(pointerFrame);
    pointerFrame = 0;
    horizon.style.removeProperty('--horizon-x');
    horizon.style.removeProperty('--horizon-y');
    horizon.style.removeProperty('--horizon-light');
  }

  function updateHorizon() {
    pointerFrame = 0;
    horizon.style.setProperty('--horizon-x', `${pointerX * -10}px`);
    horizon.style.setProperty('--horizon-y', `${pointerY * -6}px`);
    horizon.style.setProperty('--horizon-light', 1 + (pointerX + 1) * .045);
  }

  function setMotion(playing) {
    document.body.dataset.motion = playing ? 'playing' : 'paused';
    motionButton.textContent = playing ? 'Pause motion' : 'Play motion';
    if (!playing) resetHorizon();
  }

  setMotion(!motionPreference.matches);
  motionButton.hidden = false;
  motionButton.addEventListener('click', () => {
    setMotion(document.body.dataset.motion !== 'playing');
  });
  motionPreference.addEventListener('change', event => setMotion(!event.matches));
  window.addEventListener('pointermove', event => {
    if (event.pointerType !== 'mouse' || document.body.dataset.motion !== 'playing') return;
    pointerX = event.clientX / window.innerWidth * 2 - 1;
    pointerY = event.clientY / window.innerHeight * 2 - 1;
    if (!pointerFrame) pointerFrame = requestAnimationFrame(updateHorizon);
  }, { passive: true });
  document.documentElement.addEventListener('pointerleave', resetHorizon);
  window.addEventListener('blur', resetHorizon);
</script>
</body>
</html>
